name: Build and Publish pyjnius Wheels to R2

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.8'

      - name: install cibuildwheel
        run: pip install cibuildwheel

      # The emulator used by the on-device test-command needs KVM. GitHub's
      # Linux runners expose /dev/kvm; widen its permissions so it's usable.
      # Only the build-host arch (x86_64) is tested; arm64_v8a builds but
      # skips on-device tests.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: build wheels
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cibuildwheel --platform android --archs all --output-dir wheelhouse

      - run: ls wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: pyjnius-android-wheels
          path: wheelhouse/

  publish-r2:
    name: Publish to R2
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pyjnius-*-wheels
          merge-multiple: true
          path: wheels/

      - name: configure aws cli for r2
        run: |
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set region auto

      - name: upload wheels to r2
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          for FILE in wheels/*.whl; do
            BASENAME=$(basename "$FILE")
            echo "Uploading $BASENAME"
            aws s3 cp "$FILE" "s3://kivyschool-pypi/packages/$BASENAME" \
              --endpoint-url "$ENDPOINT"
          done
